<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Caska Voice Alerts</title>
</head>
<body>

<h1>Caska Voice Alerts</h1>

<p>
    Modo prueba: este Add-In anunciará cualquier excepción nueva generada en Geotab.
</p>

<button onclick="probarVoz()">Probar Voz</button>
<button onclick="probarApiGeotab()">Probar API Geotab</button>
<button onclick="consultarExcepcionesNuevas()">Consultar Excepciones Nuevas</button>
<button onclick="detenerAddIn()">Detener Add-In</button>
<button onclick="reanudarAddIn()">Reanudar Add-In</button>

<div id="estado">Estado: esperando inicialización...</div>

<script>
let geotabApi = null;
let geotabState = null;

let monitoreoIniciado = false;
let monitoreoActivo = true;
let consultando = false;
let fechaInicioMonitoreo = null;
let ultimaConsulta = null;
let temporizadorMonitoreo = null;
let excepcionesAnunciadas = new Set();

let activosPorId = {};

const INTERVALO_CONSULTA_MS = 5000;

function actualizarEstado(texto) {
    const estado = document.getElementById("estado");
    if (estado) {
        estado.innerText = texto;
    }
    console.log(texto);
}

function hablarAlerta(texto) {
    if (!monitoreoActivo) {
        return;
    }

    speechSynthesis.cancel();

    const mensaje = new SpeechSynthesisUtterance(texto);
    mensaje.lang = "es-MX";
    mensaje.rate = 1;
    mensaje.pitch = 1;

    speechSynthesis.speak(mensaje);
}

function probarVoz() {
    speechSynthesis.cancel();

    const mensaje = new SpeechSynthesisUtterance("Alerta de prueba desde Caska");
    mensaje.lang = "es-MX";
    mensaje.rate = 1;
    mensaje.pitch = 1;

    speechSynthesis.speak(mensaje);
}

function probarApiGeotab() {
    if (!geotabApi) {
        actualizarEstado("API Geotab todavía NO disponible");
        return;
    }

    geotabApi.call(
        "Get",
        {
            typeName: "Device",
            resultsLimit: 5
        },
        function (devices) {
            console.log("Dispositivos recibidos:", devices);

            if (devices && devices.length > 0) {
                actualizarEstado("API Geotab OK. Primer activo: " + devices[0].name);
                hablarAlerta("Conexión correcta con Geotab. Primer activo encontrado: " + devices[0].name);
            } else {
                actualizarEstado("API Geotab OK, pero no regresó activos");
            }
        },
        function (error) {
            console.error("Error al consultar activos:", error);
            actualizarEstado("Error al consultar API Geotab");
        }
    );
}

function cargarActivos() {
    if (!geotabApi) {
        actualizarEstado("API Geotab todavía NO disponible para cargar activos");
        return;
    }

    actualizarEstado("Cargando nombres reales de activos...");

    geotabApi.call(
        "Get",
        {
            typeName: "Device",
            resultsLimit: 5000
        },
        function (devices) {
            activosPorId = {};

            if (devices && devices.length > 0) {
                devices.forEach(function (device) {
                    if (device.id) {
                        activosPorId[device.id] = device;
                    }
                });

                actualizarEstado("Activos cargados: " + devices.length);
                console.log("Mapa de activos cargado:", activosPorId);
            } else {
                actualizarEstado("No se encontraron activos para cargar nombres");
            }
        },
        function (error) {
            console.error("Error al cargar activos:", error);
            actualizarEstado("Error al cargar nombres de activos");
        }
    );
}

function iniciarMonitoreoAutomatico() {
    if (monitoreoIniciado) {
        return;
    }

    monitoreoIniciado = true;
    monitoreoActivo = true;
    fechaInicioMonitoreo = new Date();
    ultimaConsulta = new Date();

    cargarActivos();

    actualizarEstado("Modo prueba iniciado. Se anunciará cualquier excepción nueva.");

    temporizadorMonitoreo = setInterval(function () {
        if (monitoreoActivo) {
            consultarExcepcionesNuevas();
        }
    }, INTERVALO_CONSULTA_MS);
}

function detenerAddIn() {
    monitoreoActivo = false;
    consultando = false;

    if (temporizadorMonitoreo) {
        clearInterval(temporizadorMonitoreo);
        temporizadorMonitoreo = null;
    }

    speechSynthesis.cancel();

    actualizarEstado("Add-In detenido. No se consultarán ni sonarán nuevas alertas.");
}

function reanudarAddIn() {
    if (!geotabApi) {
        actualizarEstado("API Geotab todavía NO disponible");
        return;
    }

    monitoreoActivo = true;
    monitoreoIniciado = true;
    consultando = false;
    ultimaConsulta = new Date();

    cargarActivos();

    if (temporizadorMonitoreo) {
        clearInterval(temporizadorMonitoreo);
    }

    temporizadorMonitoreo = setInterval(function () {
        if (monitoreoActivo) {
            consultarExcepcionesNuevas();
        }
    }, INTERVALO_CONSULTA_MS);

    actualizarEstado("Add-In reanudado. Se anunciará cualquier excepción nueva desde este momento.");
}

function consultarExcepcionesNuevas() {
    if (!monitoreoActivo) {
        return;
    }

    if (!geotabApi) {
        actualizarEstado("API Geotab todavía NO disponible");
        return;
    }

    if (consultando) {
        return;
    }

    consultando = true;

    const ahora = new Date();
    const desde = ultimaConsulta || fechaInicioMonitoreo || ahora;

    geotabApi.call(
        "Get",
        {
            typeName: "ExceptionEvent",
            search: {
                fromDate: desde.toISOString(),
                toDate: ahora.toISOString()
            },
            resultsLimit: 50
        },
        function (excepciones) {
            console.log("Excepciones recibidas:", excepciones);

            ultimaConsulta = ahora;
            consultando = false;

            if (!excepciones || excepciones.length === 0) {
                actualizarEstado("Monitoreando. Sin excepciones nuevas.");
                return;
            }

            actualizarEstado("Excepciones nuevas recibidas: " + excepciones.length);

            excepciones.forEach(function (excepcion) {
                procesarExcepcionNueva(excepcion);
            });
        },
        function (error) {
            console.error("Error al consultar excepciones:", error);
            actualizarEstado("Error al consultar excepciones");
            consultando = false;
        }
    );
}

function procesarExcepcionNueva(excepcion) {
    if (!monitoreoActivo) {
        return;
    }

    const idExcepcion = excepcion.id || JSON.stringify(excepcion);

    if (excepcionesAnunciadas.has(idExcepcion)) {
        return;
    }

    excepcionesAnunciadas.add(idExcepcion);

    const unidad = obtenerNombreRealActivo(excepcion.device);
    const regla = obtenerNombreEntidad(excepcion.rule, "excepción detectada");

    const texto = "Alerta. La unidad " + unidad + " generó la excepción " + regla;

    actualizarEstado(texto);
    hablarAlerta(texto);
}

function obtenerNombreRealActivo(deviceRef) {
    if (!deviceRef) {
        return "unidad desconocida";
    }

    if (deviceRef.id && activosPorId[deviceRef.id] && activosPorId[deviceRef.id].name) {
        return activosPorId[deviceRef.id].name;
    }

    if (deviceRef.name) {
        return deviceRef.name;
    }

    if (deviceRef.id) {
        return deviceRef.id;
    }

    return "unidad desconocida";
}

function obtenerNombreEntidad(entidad, textoDefault) {
    if (!entidad) {
        return textoDefault;
    }

    if (entidad.name) {
        return entidad.name;
    }

    if (entidad.id) {
        return entidad.id;
    }

    return textoDefault;
}

function crearModuloAddIn() {
    return {
        initialize: function (api, state, callback) {
            geotabApi = api;
            geotabState = state;

            actualizarEstado("Estado: API Geotab inicializada correctamente");
            iniciarMonitoreoAutomatico();

            callback();
        },

        focus: function (api, state) {
            geotabApi = api;
            geotabState = state;

            if (monitoreoActivo && !temporizadorMonitoreo) {
                reanudarAddIn();
            }

            actualizarEstado("Estado: Add-In activo dentro de MyGeotab");
        },

        blur: function () {
            console.log("Blur ejecutado");
        }
    };
}

window.probarVoz = probarVoz;
window.probarApiGeotab = probarApiGeotab;
window.consultarExcepcionesNuevas = consultarExcepcionesNuevas;
window.detenerAddIn = detenerAddIn;
window.reanudarAddIn = reanudarAddIn;

geotab.addin.caskaVoiceAlerts = crearModuloAddIn;
geotab.addin.caska_voice_alerts = crearModuloAddIn;
geotab.addin.caskaGeotabVoiceAlerts = crearModuloAddIn;
geotab.addin.caska_geotab_voice_alerts = crearModuloAddIn;

actualizarEstado("Estado: código cargado, esperando API de MyGeotab...");
</script>

</body>
</html>
