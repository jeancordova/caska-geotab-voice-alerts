<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Caska Voice Alerts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 18px;
        }

        button {
            margin-right: 5px;
            margin-bottom: 12px;
        }

        #panelEstado {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #b8b8b8;
            background-color: #f5f5f5;
            max-width: 900px;
        }

        #estadoPrincipal {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #alertaAudible {
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Caska Voice Alerts</h1>

<p>
    Este Add-In anuncia las excepciones nuevas autorizadas.
</p>

<button onclick="probarVoz()">Probar Voz</button>
<button onclick="probarApiGeotab()">Probar API Geotab</button>
<button onclick="consultarExcepcionesNuevas()">Consultar Excepciones Nuevas</button>
<button onclick="detenerAddIn()">Detener Add-In</button>
<button onclick="reanudarAddIn()">Reanudar Add-In</button>

<div id="panelEstado">
    <div id="estadoPrincipal">
        Estado: esperando inicialización...
    </div>

    <div id="alertaAudible">
        Alerta audible: esperando una alerta nueva...
    </div>
</div>

<script>
let geotabApi = null;
let geotabState = null;

let monitoreoIniciado = false;
let monitoreoActivo = true;
let consultando = false;

let fechaInicioMonitoreo = null;
let ultimaConsulta = null;
let temporizadorMonitoreo = null;

let excepcionesProcesadas = new Set();

let activosPorId = {};
let reglasPorId = {};

const INTERVALO_CONSULTA_MS = 5000;


/* =========================================================
   EXCEPCIONES QUE NO DEBEN SONAR
========================================================= */

const PALABRAS_EXCLUIDAS = [
    "engine",
    "Tire"
];


/* =========================================================
   TRADUCCIONES EXACTAS
========================================================= */

const TRADUCCIONES_EXACTAS = {
    "speeding": "Exceso de velocidad",
    "speeding exception": "Exceso de velocidad",
    "maximum speed exceeded": "Velocidad máxima excedida",
    "speed limit exceeded": "Límite de velocidad excedido",

    "harsh braking": "Frenado brusco",
    "hard braking": "Frenado brusco",
    "harsh acceleration": "Aceleración brusca",
    "hard acceleration": "Aceleración brusca",
    "harsh cornering": "Vuelta brusca",
    "hard cornering": "Vuelta brusca",

    "idling": "Motor encendido sin movimiento",
    "excessive idling": "Tiempo excesivo con el motor encendido sin movimiento",
    "long idling": "Tiempo prolongado con el motor encendido sin movimiento",

    "seat belt": "Cinturón de seguridad",
    "seat belt violation": "Incumplimiento de uso del cinturón de seguridad",
    "driver seat belt violation": "El conductor no utiliza el cinturón de seguridad",

    "entering zone": "Entrada a zona",
    "entered zone": "Ingresó a una zona",
    "zone entry": "Entrada a zona",

    "leaving zone": "Salida de zona",
    "left zone": "Salió de una zona",
    "zone exit": "Salida de zona",

    "route deviation": "Desvío de ruta",
    "route violation": "Incumplimiento de ruta",
    "unauthorized route": "Ruta no autorizada",

    "stopped": "Unidad detenida",
    "vehicle stopped": "Vehículo detenido",
    "unauthorized stop": "Detención no autorizada",
    "excessive stop": "Detención prolongada",

    "unauthorized device removal": "Retiro no autorizado del dispositivo",
    "device unplugged": "Dispositivo desconectado",
    "device disconnected": "Dispositivo desconectado",

    "gps signal lost": "Se perdió la señal GPS",
    "gps disconnected": "GPS desconectado",
    "no gps signal": "Sin señal GPS",

    "battery low": "Batería baja",
    "low battery": "Batería baja",
    "battery disconnected": "Batería desconectada",

    "collision detected": "Colisión detectada",
    "possible collision": "Posible colisión",
    "accident detected": "Accidente detectado",

    "panic button": "Botón de pánico",
    "panic button activated": "Botón de pánico activado",

    "unauthorized use": "Uso no autorizado",
    "after hours use": "Uso fuera del horario autorizado",
    "vehicle used after hours": "Vehículo utilizado fuera del horario autorizado",

    "driver changed": "Cambio de conductor",
    "unknown driver": "Conductor desconocido",
    "unauthorized driver": "Conductor no autorizado"
};


/* =========================================================
   TRADUCCIONES PARCIALES
========================================================= */

const REEMPLAZOS_PARCIALES = [
    ["speeding", "exceso de velocidad"],
    ["speed limit", "límite de velocidad"],
    ["maximum speed", "velocidad máxima"],
    ["speed", "velocidad"],

    ["harsh braking", "frenado brusco"],
    ["hard braking", "frenado brusco"],
    ["braking", "frenado"],

    ["harsh acceleration", "aceleración brusca"],
    ["hard acceleration", "aceleración brusca"],
    ["acceleration", "aceleración"],

    ["harsh cornering", "vuelta brusca"],
    ["hard cornering", "vuelta brusca"],
    ["cornering", "vuelta"],

    ["entering", "entrada a"],
    ["entered", "ingresó a"],
    ["leaving", "salida de"],
    ["left", "salió de"],
    ["zone", "zona"],

    ["route deviation", "desvío de ruta"],
    ["route", "ruta"],
    ["deviation", "desvío"],

    ["vehicle stopped", "vehículo detenido"],
    ["stopped", "detenido"],
    ["stop", "detención"],

    ["idling", "motor encendido sin movimiento"],
    ["seat belt", "cinturón de seguridad"],

    ["unauthorized", "no autorizado"],
    ["violation", "incumplimiento"],
    ["exception", "excepción"],
    ["warning", "advertencia"],
    ["alert", "alerta"],

    ["device disconnected", "dispositivo desconectado"],
    ["device unplugged", "dispositivo desconectado"],
    ["device", "dispositivo"],

    ["gps signal lost", "se perdió la señal GPS"],
    ["gps signal", "señal GPS"],

    ["battery low", "batería baja"],
    ["low battery", "batería baja"],
    ["battery", "batería"],

    ["collision", "colisión"],
    ["accident", "accidente"],
    ["driver", "conductor"],
    ["unknown", "desconocido"],

    ["after hours", "fuera del horario autorizado"],
    ["activated", "activado"],
    ["detected", "detectado"],
    ["disconnected", "desconectado"],
    ["removal", "retiro"],
    ["exceeded", "excedido"],
    ["excessive", "excesivo"],
    ["maximum", "máximo"],
    ["minimum", "mínimo"]
];


/* =========================================================
   INTERFAZ
========================================================= */

function actualizarEstado(texto) {
    const elemento = document.getElementById("estadoPrincipal");

    if (elemento) {
        elemento.innerText = texto;
    }

    console.log(texto);
}


function mostrarAlertaAudible(texto) {
    const elemento = document.getElementById("alertaAudible");

    if (elemento) {
        elemento.innerText = "Alerta audible: " + texto;
    }
}


/* =========================================================
   TRADUCCIÓN
========================================================= */

function normalizarTexto(texto) {
    return texto
        .toString()
        .trim()
        .replace(/\s+/g, " ");
}


function traducirNombreRegla(nombreOriginal) {
    if (!nombreOriginal) {
        return "Excepción detectada";
    }

    const nombreLimpio = normalizarTexto(nombreOriginal);
    const nombreMinusculas = nombreLimpio.toLowerCase();

    if (TRADUCCIONES_EXACTAS[nombreMinusculas]) {
        return TRADUCCIONES_EXACTAS[nombreMinusculas];
    }

    let textoTraducido = nombreMinusculas;
    let traduccionAplicada = false;

    REEMPLAZOS_PARCIALES.forEach(function (reemplazo) {
        const textoIngles = reemplazo[0];
        const textoEspanol = reemplazo[1];

        if (textoTraducido.includes(textoIngles)) {
            textoTraducido = textoTraducido
                .split(textoIngles)
                .join(textoEspanol);

            traduccionAplicada = true;
        }
    });

    if (traduccionAplicada) {
        textoTraducido = textoTraducido
            .replace(/\s+/g, " ")
            .trim();

        return textoTraducido.charAt(0).toUpperCase()
            + textoTraducido.slice(1);
    }

    return nombreLimpio;
}


/* =========================================================
   FILTRO
========================================================= */

function excepcionDebeSerIgnorada(nombreReglaOriginal) {
    if (!nombreReglaOriginal) {
        return false;
    }

    const nombreNormalizado = nombreReglaOriginal
        .toString()
        .toLowerCase()
        .trim();

    return PALABRAS_EXCLUIDAS.some(function (palabra) {
        return nombreNormalizado.includes(
            palabra.toLowerCase()
        );
    });
}


/* =========================================================
   VOZ
========================================================= */

function hablarAlerta(texto) {
    if (!monitoreoActivo) {
        return;
    }

    const mensaje = new SpeechSynthesisUtterance(texto);

    mensaje.lang = "es-MX";
    mensaje.rate = 1;
    mensaje.pitch = 1;
    mensaje.volume = 1;

    mensaje.onerror = function (evento) {
        console.error(
            "Error de síntesis de voz:",
            evento
        );
    };

    mostrarAlertaAudible(texto);

    console.log(
        "Alerta enviada a la voz:",
        texto
    );

    window.speechSynthesis.speak(mensaje);
}


function probarVoz() {
    window.speechSynthesis.cancel();

    const texto = "Alerta de prueba desde Caska";

    const mensaje = new SpeechSynthesisUtterance(texto);

    mensaje.lang = "es-MX";
    mensaje.rate = 1;
    mensaje.pitch = 1;
    mensaje.volume = 1;

    mostrarAlertaAudible(texto);

    window.speechSynthesis.speak(mensaje);
}


/* =========================================================
   PRUEBA DE API
========================================================= */

function probarApiGeotab() {
    if (!geotabApi) {
        actualizarEstado(
            "Estado: API Geotab todavía no disponible"
        );

        return;
    }

    geotabApi.call(
        "Get",
        {
            typeName: "Device",
            resultsLimit: 5
        },
        function (devices) {
            if (devices && devices.length > 0) {
                const nombreActivo =
                    devices[0].name ||
                    "activo desconocido";

                const texto =
                    "Conexión correcta con Geotab. "
                    + "Primer activo encontrado: "
                    + nombreActivo;

                hablarAlerta(texto);
            } else {
                console.log(
                    "API correcta, pero no regresó activos."
                );
            }
        },
        function (error) {
            console.error(
                "Error al consultar la API:",
                error
            );

            actualizarEstado(
                "Estado: error al consultar la API"
            );
        }
    );
}


/* =========================================================
   CARGA DE ACTIVOS
========================================================= */

function cargarActivos(callback) {
    if (!geotabApi) {
        if (callback) {
            callback(false);
        }

        return;
    }

    geotabApi.call(
        "Get",
        {
            typeName: "Device",
            resultsLimit: 5000
        },
        function (devices) {
            activosPorId = {};

            if (devices && devices.length > 0) {
                devices.forEach(function (device) {
                    if (device.id) {
                        activosPorId[device.id] = device;
                    }
                });
            }

            console.log(
                "Activos cargados:",
                Object.keys(activosPorId).length
            );

            if (callback) {
                callback(true);
            }
        },
        function (error) {
            console.error(
                "Error al cargar activos:",
                error
            );

            if (callback) {
                callback(false);
            }
        }
    );
}


/* =========================================================
   CARGA DE REGLAS
========================================================= */

function cargarReglas(callback) {
    if (!geotabApi) {
        if (callback) {
            callback(false);
        }

        return;
    }

    geotabApi.call(
        "Get",
        {
            typeName: "Rule",
            resultsLimit: 5000
        },
        function (rules) {
            reglasPorId = {};

            if (rules && rules.length > 0) {
                rules.forEach(function (rule) {
                    if (rule.id) {
                        reglasPorId[rule.id] = rule;
                    }
                });
            }

            console.log(
                "Reglas cargadas:",
                Object.keys(reglasPorId).length
            );

            if (callback) {
                callback(true);
            }
        },
        function (error) {
            console.error(
                "Error al cargar reglas:",
                error
            );

            if (callback) {
                callback(false);
            }
        }
    );
}


/* =========================================================
   CARGA INICIAL
========================================================= */

function cargarDatosIniciales(callbackFinal) {
    let activosTerminados = false;
    let reglasTerminadas = false;

    function verificarFinalizacion() {
        if (activosTerminados && reglasTerminadas) {
            if (callbackFinal) {
                callbackFinal();
            }
        }
    }

    cargarActivos(function () {
        activosTerminados = true;
        verificarFinalizacion();
    });

    cargarReglas(function () {
        reglasTerminadas = true;
        verificarFinalizacion();
    });
}


/* =========================================================
   MONITOREO
========================================================= */

function iniciarMonitoreoAutomatico() {
    if (monitoreoIniciado) {
        return;
    }

    monitoreoIniciado = true;
    monitoreoActivo = true;
    consultando = false;

    fechaInicioMonitoreo = new Date();
    ultimaConsulta = new Date();

    actualizarEstado(
        "Estado: cargando información de Geotab..."
    );

    cargarDatosIniciales(function () {
        if (!monitoreoActivo) {
            return;
        }

        actualizarEstado(
            "Estado: monitoreo activo"
        );

        iniciarTemporizadorMonitoreo();
    });
}


function iniciarTemporizadorMonitoreo() {
    if (temporizadorMonitoreo) {
        clearInterval(temporizadorMonitoreo);
    }

    temporizadorMonitoreo = setInterval(
        function () {
            if (monitoreoActivo) {
                consultarExcepcionesNuevas();
            }
        },
        INTERVALO_CONSULTA_MS
    );
}


function detenerAddIn() {
    monitoreoActivo = false;
    consultando = false;

    if (temporizadorMonitoreo) {
        clearInterval(temporizadorMonitoreo);
        temporizadorMonitoreo = null;
    }

    window.speechSynthesis.cancel();

    actualizarEstado(
        "Estado: Add-In detenido"
    );
}


function reanudarAddIn() {
    if (!geotabApi) {
        actualizarEstado(
            "Estado: API Geotab todavía no disponible"
        );

        return;
    }

    monitoreoActivo = true;
    monitoreoIniciado = true;
    consultando = false;
    ultimaConsulta = new Date();

    actualizarEstado(
        "Estado: cargando información de Geotab..."
    );

    cargarDatosIniciales(function () {
        if (!monitoreoActivo) {
            return;
        }

        iniciarTemporizadorMonitoreo();

        actualizarEstado(
            "Estado: monitoreo activo"
        );
    });
}


/* =========================================================
   CONSULTA DE EXCEPCIONES
========================================================= */

function consultarExcepcionesNuevas() {
    if (!monitoreoActivo) {
        return;
    }

    if (!geotabApi) {
        actualizarEstado(
            "Estado: API Geotab no disponible"
        );

        return;
    }

    if (consultando) {
        return;
    }

    consultando = true;

    const ahora = new Date();

    const desde =
        ultimaConsulta ||
        fechaInicioMonitoreo ||
        ahora;

    geotabApi.call(
        "Get",
        {
            typeName: "ExceptionEvent",
            search: {
                fromDate: desde.toISOString(),
                toDate: ahora.toISOString()
            },
            resultsLimit: 100
        },
        function (excepciones) {
            ultimaConsulta = ahora;
            consultando = false;

            actualizarEstado(
                "Estado: monitoreo activo"
            );

            if (!excepciones || excepciones.length === 0) {
                console.log(
                    "Consulta completada sin excepciones nuevas."
                );

                return;
            }

            console.log(
                "Excepciones recibidas:",
                excepciones
            );

            excepciones.forEach(function (excepcion) {
                procesarExcepcionNueva(excepcion);
            });
        },
        function (error) {
            consultando = false;

            console.error(
                "Error al consultar excepciones:",
                error
            );

            actualizarEstado(
                "Estado: error al consultar excepciones"
            );
        }
    );
}


/* =========================================================
   PROCESAMIENTO
========================================================= */

function procesarExcepcionNueva(excepcion) {
    const idExcepcion =
        excepcion.id ||
        crearIdentificadorAlternativo(excepcion);

    if (excepcionesProcesadas.has(idExcepcion)) {
        console.log(
            "Excepción repetida ignorada:",
            idExcepcion
        );

        return;
    }

    excepcionesProcesadas.add(idExcepcion);

    const unidad =
        obtenerNombreRealActivo(
            excepcion.device
        );

    const reglaOriginal =
        obtenerNombreRealRegla(
            excepcion.rule
        );

    if (excepcionDebeSerIgnorada(reglaOriginal)) {
        console.log(
            "Excepción ignorada por filtro:",
            {
                unidad: unidad,
                regla: reglaOriginal,
                id: idExcepcion
            }
        );

        return;
    }

    const reglaTraducida =
        traducirNombreRegla(reglaOriginal);

    const texto =
        "Alerta. La unidad "
        + unidad
        + " generó la excepción "
        + reglaTraducida;

    hablarAlerta(texto);
}


function crearIdentificadorAlternativo(excepcion) {
    const deviceId =
        excepcion.device &&
        excepcion.device.id
        ? excepcion.device.id
        : "sin-dispositivo";

    const ruleId =
        excepcion.rule &&
        excepcion.rule.id
        ? excepcion.rule.id
        : "sin-regla";

    const fecha =
        excepcion.activeFrom ||
        excepcion.dateTime ||
        excepcion.activeTo ||
        JSON.stringify(excepcion);

    return (
        deviceId
        + "|"
        + ruleId
        + "|"
        + fecha
    );
}


/* =========================================================
   NOMBRES REALES
========================================================= */

function obtenerNombreRealActivo(deviceRef) {
    if (!deviceRef) {
        return "unidad desconocida";
    }

    if (
        deviceRef.id &&
        activosPorId[deviceRef.id] &&
        activosPorId[deviceRef.id].name
    ) {
        return activosPorId[deviceRef.id].name;
    }

    if (deviceRef.name) {
        return deviceRef.name;
    }

    return "unidad desconocida";
}


function obtenerNombreRealRegla(ruleRef) {
    if (!ruleRef) {
        return "Excepción detectada";
    }

    if (
        ruleRef.id &&
        reglasPorId[ruleRef.id] &&
        reglasPorId[ruleRef.id].name
    ) {
        return reglasPorId[ruleRef.id].name;
    }

    if (ruleRef.name) {
        return ruleRef.name;
    }

    return "Excepción detectada";
}


/* =========================================================
   CICLO DE VIDA DEL ADD-IN
========================================================= */

function crearModuloAddIn() {
    return {
        initialize: function (api, state, callback) {
            geotabApi = api;
            geotabState = state;

            actualizarEstado(
                "Estado: API Geotab inicializada"
            );

            iniciarMonitoreoAutomatico();

            callback();
        },

        focus: function (api, state) {
            geotabApi = api;
            geotabState = state;

            if (
                monitoreoActivo &&
                monitoreoIniciado &&
                !temporizadorMonitoreo
            ) {
                iniciarTemporizadorMonitoreo();
            }

            if (monitoreoActivo) {
                actualizarEstado(
                    "Estado: monitoreo activo"
                );
            }
        },

        blur: function () {
            console.log("Blur ejecutado");
        }
    };
}


/* =========================================================
   BOTONES
========================================================= */

window.probarVoz = probarVoz;
window.probarApiGeotab = probarApiGeotab;
window.consultarExcepcionesNuevas = consultarExcepcionesNuevas;
window.detenerAddIn = detenerAddIn;
window.reanudarAddIn = reanudarAddIn;


/* =========================================================
   REGISTRO
========================================================= */

geotab.addin.caskaVoiceAlerts = crearModuloAddIn;
geotab.addin.caska_voice_alerts = crearModuloAddIn;
geotab.addin.caskaGeotabVoiceAlerts = crearModuloAddIn;
geotab.addin.caska_geotab_voice_alerts = crearModuloAddIn;

actualizarEstado(
    "Estado: código cargado, esperando API de MyGeotab..."
);
</script>

</body>
</html>
