<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Caska Voice Alerts</title>
</head>
<body>

<h1>Caska Voice Alerts</h1>

<p>
    Este Add-In monitorea excepciones nuevas de Geotab y las verbaliza por las bocinas de la computadora.
</p>

<button onclick="probarVoz()">Probar Voz</button>
<button onclick="probarApiGeotab()">Probar API Geotab</button>
<button onclick="consultarExcepcionesNuevas()">Consultar Excepciones Nuevas</button>

<div id="estado">Estado: esperando inicialización...</div>

<script>
let geotabApi = null;
let geotabState = null;

let monitoreoIniciado = false;
let consultando = false;
let fechaInicioMonitoreo = null;
let ultimaConsulta = null;
let excepcionesAnunciadas = new Set();

const INTERVALO_CONSULTA_MS = 5000;

function actualizarEstado(texto) {
    const estado = document.getElementById("estado");
    if (estado) {
        estado.innerText = texto;
    }
    console.log(texto);
}

function hablarAlerta(texto) {
    const mensaje = new SpeechSynthesisUtterance(texto);
    mensaje.lang = "es-MX";
    mensaje.rate = 1;
    mensaje.pitch = 1;
    speechSynthesis.speak(mensaje);
}

function probarVoz() {
    hablarAlerta("Alerta de prueba desde Caska");
}

function probarApiGeotab() {
    if (!geotabApi) {
        actualizarEstado("API Geotab todavía NO disponible");
        return;
    }

    geotabApi.call(
        "Get",
        {
            typeName: "Device",
            resultsLimit: 5
        },
        function (devices) {
            if (devices && devices.length > 0) {
                actualizarEstado("API Geotab OK. Primer dispositivo: " + devices[0].name);
                hablarAlerta("Conexión correcta con Geotab");
            } else {
                actualizarEstado("API Geotab OK, pero no regresó dispositivos");
            }
        },
        function (error) {
            console.error("Error al consultar dispositivos:", error);
            actualizarEstado("Error al consultar API Geotab");
        }
    );
}

function iniciarMonitoreoAutomatico() {
    if (monitoreoIniciado) {
        return;
    }

    monitoreoIniciado = true;
    fechaInicioMonitoreo = new Date();
    ultimaConsulta = new Date();

    actualizarEstado("Monitoreo iniciado. Sólo se anunciarán excepciones nuevas.");

    setInterval(function () {
        consultarExcepcionesNuevas();
    }, INTERVALO_CONSULTA_MS);
}

function consultarExcepcionesNuevas() {
    if (!geotabApi) {
        actualizarEstado("API Geotab todavía NO disponible");
        return;
    }

    if (consultando) {
        return;
    }

    consultando = true;

    const ahora = new Date();
    const desde = ultimaConsulta || fechaInicioMonitoreo || ahora;

    geotabApi.call(
        "Get",
        {
            typeName: "ExceptionEvent",
            search: {
                fromDate: desde.toISOString(),
                toDate: ahora.toISOString()
            },
            resultsLimit: 50
        },
        function (excepciones) {
            console.log("Excepciones nuevas recibidas:", excepciones);

            ultimaConsulta = ahora;
            consultando = false;

            if (!excepciones || excepciones.length === 0) {
                actualizarEstado("Monitoreando. Sin excepciones nuevas.");
                return;
            }

            excepciones.forEach(function (excepcion) {
                procesarExcepcionNueva(excepcion);
            });
        },
        function (error) {
            console.error("Error al consultar excepciones:", error);
            actualizarEstado("Error al consultar excepciones");
            consultando = false;
        }
    );
}

function procesarExcepcionNueva(excepcion) {
    const idExcepcion = excepcion.id || JSON.stringify(excepcion);

    if (excepcionesAnunciadas.has(idExcepcion)) {
        return;
    }

    excepcionesAnunciadas.add(idExcepcion);

    const unidad = obtenerNombreEntidad(excepcion.device, "unidad desconocida");
    const regla = obtenerNombreEntidad(excepcion.rule, "excepción detectada");

    const texto = "Alerta. La unidad " + unidad + " generó la excepción " + regla;

    actualizarEstado(texto);
    hablarAlerta(texto);
}

function obtenerNombreEntidad(entidad, textoDefault) {
    if (!entidad) {
        return textoDefault;
    }

    if (entidad.name) {
        return entidad.name;
    }

    if (entidad.id) {
        return entidad.id;
    }

    return textoDefault;
}

function crearModuloAddIn() {
    return {
        initialize: function (api, state, callback) {
            geotabApi = api;
            geotabState = state;

            console.log("Initialize ejecutado");
            console.log("API recibida:", api);
            console.log("State recibido:", state);

            actualizarEstado("Estado: API Geotab inicializada correctamente");

            iniciarMonitoreoAutomatico();

            callback();
        },

        focus: function (api, state) {
            geotabApi = api;
            geotabState = state;

            console.log("Focus ejecutado");
            actualizarEstado("Estado: Add-In activo dentro de MyGeotab");

            iniciarMonitoreoAutomatico();
        },

        blur: function () {
            console.log("Blur ejecutado");
        }
    };
}

geotab.addin.caskaVoiceAlerts = crearModuloAddIn;
geotab.addin.caska_voice_alerts = crearModuloAddIn;
geotab.addin.caskaGeotabVoiceAlerts = crearModuloAddIn;
geotab.addin.caska_geotab_voice_alerts = crearModuloAddIn;

actualizarEstado("Estado: código cargado, esperando API de MyGeotab...");
</script>

</body>
</html>
